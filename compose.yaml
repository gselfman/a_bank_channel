version: "3.8"
services:
  worker:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./state:/data
      - ./config.json:/app/config.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
